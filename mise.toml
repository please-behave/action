[tools]
"github:please-behave/cli" = "0.5.1"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.setup]
description = "Prepare locked dependencies online before offline Git hooks"
run = "npm ci --ignore-scripts"

[tasks."hooks:install"]
description = "Synchronize managed Please Behave hooks and imports"
run = "sh scripts/setup-git-hooks.sh"
