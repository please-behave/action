[tools]
"github:please-behave/cli" = "0.9.0"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks."ci:prepare"]
alias = "setup"
description = "Fetch locked npm dependencies for CI and offline Git hooks"
run = "npm ci --ignore-scripts"

[tasks.release]
description = "Start the GitHub Release workflow for remote main"
run = "gh workflow run release.yml --ref main"
