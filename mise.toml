[task_config]
includes = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//mise-tasks/release?ref=3c8ce48cb62d27c8c300d30f361e0832516fc860",
]

[tools]
"github:please-behave/cli" = "0.16.0"
node = "26.13.1"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
gh = "2.103.3"
ruff = "0.17.4"
shfmt = "3.14.1"
"aqua:boyter/scc" = "4.1.0"

[tasks.setup]
description = "Fetch locked npm dependencies for CI and offline Git hooks"
run = "npm ci --ignore-scripts"

[tasks.format]
description = "Format Python and shell sources"
run = ["ruff format", "git ls-files -z '*.sh' | xargs -0 -r shfmt -w"]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"
