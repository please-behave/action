project = "Please Behave Action"

[execution_points]
custom = ["release-readiness", "release-candidate", "release-record", "release-verify"]

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-rulesets.git"
path = "commit-msg/conventional-commits"
ref = "0432837bb42e230f53cd52b64b2292948382e5b2"

[imports.rule_parameters.commit-message]
scopes_file = ".please/commit-scopes.txt"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-rulesets.git"
path = "multi-point/security"
ref = "0432837bb42e230f53cd52b64b2292948382e5b2"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-rulesets.git"
path = "repository-conventions"
ref = "0432837bb42e230f53cd52b64b2292948382e5b2"

[imports.rule_parameters.license]
target = "LICENSE"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-rulesets.git"
path = "release/releasable-project"
ref = "1279facc9a4019e7f937196fb2e8b1826c67bb08"

[imports.rule_parameters.release-contract]
ci_policy = ".please/release-ci.json"
artifacts_policy = ".please/release-artifacts.json"

[[provider_imports]]
id = "gemini-flash-lite"
git = "https://github.com/christianpflugradt/please-behave-rulesets.git"
path = "providers/gemini-flash-lite"
ref = "0432837bb42e230f53cd52b64b2292948382e5b2"
