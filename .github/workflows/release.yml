name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release verifies push access even during a dry run
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Plan next semantic release without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Verify release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_HEAD: ${{ needs.plan.outputs.source_sha }}
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-readiness
          checks-only: 'true'
          summary: 'true'
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Release Candidate (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated summary acceptance fixture
        run: |
          echo "REAL_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          mv .please "$RUNNER_TEMP/original-please"
          mkdir -p .please/checks/fixture "$RUNNER_TEMP/summary-tools"
          cat > .please/config.toml <<'EOF'
          project = "Summary acceptance"
          [execution_points]
          custom = ["summary-first", "summary-second"]
          EOF
          cat > .please/checks/fixture/rule.toml <<'EOF'
          id = "fixture"
          description = "Hosted composite summary acceptance"
          run_at = ["summary-first", "summary-second"]
          blocking = true
          [check]
          command = "bash -c 'exit ${FIXTURE_RESULT:-0}'"
          EOF
          # Preserve a copy of the actual composite step summary before runner upload.
          cat > "$RUNNER_TEMP/summary-tools/python3" <<'EOF'
          #!/usr/bin/env bash
          "$REAL_PYTHON" "$@"
          result=$?
          if [[ "$1" == */scripts/summary.py ]]; then
            cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/$PLEASE_EXECUTION_POINT_INPUT.md"
          fi
          exit "$result"
          EOF
          chmod +x "$RUNNER_TEMP/summary-tools/python3"
          echo "$RUNNER_TEMP/summary-tools" >> "$GITHUB_PATH"
      - name: Invoke Action expecting success and a default summary
        id: passing
        uses: ./
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: summary-first
      - name: Invoke Action expecting governance failure
        id: failing
        # Preserve the raw failure for assertions without failing the job.
        continue-on-error: true
        uses: ./
        env:
          FIXTURE_RESULT: '1'
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: summary-second
          checks-only: 'true'
      - name: Verify Action outcomes and independent summaries
        if: always()
        env:
          PASSING_OUTCOME: ${{ steps.passing.outcome }}
          PASSING_CONCLUSION: ${{ steps.passing.conclusion }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_CONCLUSION: ${{ steps.failing.conclusion }}
        run: python3 scripts/check-action-e2e.py
      - name: Restore project governance
        run: |
          rm -rf .please
          mv "$RUNNER_TEMP/original-please" .please
          please sync --yes
      - name: Record release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-record
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.os }}
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Download release candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-evidence
          merge-multiple: true
      - name: Verify complete release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-verify
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish semantic Action release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm run release
