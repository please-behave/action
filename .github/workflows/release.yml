name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep jobs limited to their explicit tool subsets.

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release verifies push access even during a dry run
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - run: npm ci --ignore-scripts
      - name: Plan next semantic release without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python github:please-behave/cli
      - name: Verify exact-source CI prerequisites
        run: python3 .github/scripts/check-release-ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify release dependency
        uses: please-behave/action@196e1d61f898e0cb77c58ab3dd6667f021321d5e # v1.3.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: release
          summary: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Release Candidate (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        id: tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python github:please-behave/cli
      - name: Prepare isolated summary acceptance fixture
        run: bash .github/scripts/prepare-action-e2e.sh
      - name: Invoke Action expecting success and a default summary
        id: passing
        uses: ./
        with:
          version: v${{ fromJSON(steps.tools.outputs.versions)['github:please-behave/cli'][0].version }}
          execution-point: summary-first
      - name: Invoke Action expecting governance failure
        id: failing
        # Preserve the raw failure for assertions without failing the job.
        continue-on-error: true
        uses: ./
        env:
          FIXTURE_RESULT: '1'
        with:
          install: 'false'
          sync: 'true'
          execution-point: summary-second
      - name: Verify Action outcomes and independent summaries
        if: always()
        env:
          PASSING_OUTCOME: ${{ steps.passing.outcome }}
          PASSING_CONCLUSION: ${{ steps.passing.conclusion }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_CONCLUSION: ${{ steps.failing.conclusion }}
        run: python3 .github/scripts/check-action-e2e.py
      - name: Restore project governance
        run: |
          rm -rf .please
          mv "$RUNNER_TEMP/original-please" .please
      - name: Record release candidate evidence
        run: python3 .github/scripts/release-evidence.py record
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.os }}
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
      - run: npm ci --ignore-scripts
      - name: Download release candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-evidence
          merge-multiple: true
      - name: Verify complete release candidate evidence
        run: python3 .github/scripts/release-evidence.py verify
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish semantic Action release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm run release
