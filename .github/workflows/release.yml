name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep jobs limited to their explicit tool subsets.

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@4466526021c1101170b208e3cadbbe1973313423 # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@4466526021c1101170b208e3cadbbe1973313423 # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: |
        check (ubuntu-24.04) / Check
        check (ubuntu-24.04-arm) / Check

  release-candidate:
    name: Release Candidate (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        id: tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - name: Verify the candidate at the release point
        uses: christianpflugradt/please-behave-governance/actions/release/governance@afcf276e729e20b014b25b713a52b577f9224ccf # updates/actions/release
        if: matrix.os == 'ubuntu-24.04'
      - name: Prepare isolated summary acceptance fixture
        run: bash .github/scripts/prepare-action-e2e.sh
      - name: Invoke Action expecting success and a default summary
        id: passing
        uses: ./
        with:
          version: v${{ fromJSON(steps.tools.outputs.versions)['github:please-behave/cli'][0].version }}
          execution-point: summary-first
      - name: Invoke Action expecting governance failure
        id: failing
        # Preserve the raw failure for assertions without failing the job.
        continue-on-error: true
        uses: ./
        env:
          FIXTURE_RESULT: '1'
        with:
          install: 'false'
          sync: 'true'
          execution-point: summary-second
      - name: Verify Action outcomes and independent summaries
        if: always()
        env:
          PASSING_OUTCOME: ${{ steps.passing.outcome }}
          PASSING_CONCLUSION: ${{ steps.passing.conclusion }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_CONCLUSION: ${{ steps.failing.conclusion }}
        run: python3 .github/scripts/check-action-e2e.py
      - name: Restore project governance
        run: |
          rm -rf .please
          mv "$RUNNER_TEMP/original-please" .please
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@afcf276e729e20b014b25b713a52b577f9224ccf # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: ${{ matrix.os }}

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@afcf276e729e20b014b25b713a52b577f9224ccf # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish semantic Action release
        uses: christianpflugradt/please-behave-governance/actions/release/publish-release@afcf276e729e20b014b25b713a52b577f9224ccf # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          force: ${{ inputs.force }}
