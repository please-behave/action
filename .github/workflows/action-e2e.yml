name: Action E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare isolated summary acceptance fixture
        run: |
          mv .please "$RUNNER_TEMP/original-please"
          mkdir -p .please/checks/fixture "$RUNNER_TEMP/summary-tools"
          cat > .please/config.toml <<'EOF'
          project = "Summary acceptance"
          [execution_points]
          custom = ["summary-first", "summary-second"]
          EOF
          cat > .please/checks/fixture/rule.toml <<'EOF'
          id = "fixture"
          description = "Hosted composite summary acceptance"
          run_at = ["summary-first", "summary-second"]
          blocking = true
          [check]
          command = "bash -c 'exit ${FIXTURE_RESULT:-0}'"
          EOF
          # Preserve a copy of the actual composite step summary before runner upload.
          cat > "$RUNNER_TEMP/summary-tools/python3" <<'EOF'
          #!/usr/bin/env bash
          /usr/bin/python3 "$@"
          result=$?
          if [[ "$1" == */scripts/summary.py ]]; then
            cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/$PLEASE_EXECUTION_POINT_INPUT.md"
          fi
          exit "$result"
          EOF
          chmod +x "$RUNNER_TEMP/summary-tools/python3"
          echo "$RUNNER_TEMP/summary-tools" >> "$GITHUB_PATH"
      - name: Invoke Action expecting success and a default summary
        id: passing
        uses: ./
        with:
          version: v0.5.0
          execution-point: summary-first
      - name: Invoke Action expecting governance failure
        id: failing
        # Preserve the raw failure for assertions without failing the job.
        continue-on-error: true
        uses: ./
        env:
          FIXTURE_RESULT: '1'
        with:
          version: v0.5.0
          execution-point: summary-second
          checks-only: 'true'
      - name: Verify Action outcomes and independent summaries
        if: always()
        env:
          PASSING_OUTCOME: ${{ steps.passing.outcome }}
          PASSING_CONCLUSION: ${{ steps.passing.conclusion }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_CONCLUSION: ${{ steps.failing.conclusion }}
        run: python3 scripts/check-action-e2e.py
