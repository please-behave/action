name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@7d4d524a32ef91207f9da7e6eaea2c6f4a6ceaea # updates/workflows/ci
    with:
      runner: ${{ matrix.os }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
