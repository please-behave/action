name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Prepare validation dependencies
        run: |
          npm ci --ignore-scripts
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Install released governor
        uses: please-behave/action@e932d80af960ea29d3da4ff77c35e1b1378dc9ba # v1.1.0
        with:
          version: v0.3.1
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Run quality gates
        uses: please-behave/action@e932d80af960ea29d3da4ff77c35e1b1378dc9ba # v1.1.0
        with:
          version: v0.3.1
          execution-point: check
          summary: 'true'
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.os }}
          path: .please/reports/*.json
          if-no-files-found: ignore
          include-hidden-files: true
