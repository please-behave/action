name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@4a3679d9da910272ca4d741307e4cbbe2bde6d6e # updates/workflows/ci
    with:
      runner: ${{ matrix.os }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
