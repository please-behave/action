name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@385ef5226fd84de42a1529f395469fb135e38e49 # updates/workflows/ci
    with:
      runner: ${{ matrix.os }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
