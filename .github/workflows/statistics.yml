name: Statistics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false' # Install tools explicitly before running tasks.
jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install scc and Python
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: aqua:boyter/scc python
      - name: Install coverage.py
        run: python3 -m pip install --disable-pip-version-check coverage==7.17.3
      - name: Run Action tests with coverage
        shell: bash
        run: |
          mkdir -p build/statistics
          python3 -m coverage run --rcfile=.github/coverage.toml -m unittest discover -s tests 2>&1 | tee build/unittest.log
          python3 -m coverage combine --rcfile=.github/coverage.toml
          python3 -m coverage json --rcfile=.github/coverage.toml -o build/coverage.json
      - name: Write metrics
        run: |
          scc --format json scripts action.yml >build/scc.json
          python3 .github/scripts/write-coverage-metrics.py build/coverage.json build/statistics
          python3 .github/scripts/write-count-metrics.py build/scc.json build/unittest.log build/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statistics-metrics
          path: build/statistics
          if-no-files-found: error

  publish:
    name: Publish statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: statistics-metrics
          path: metrics
      - name: Send statistics to badges-and-stuff
        env:
          GH_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
        run: |
          set -euo pipefail
          jq --slurp \
            --arg project please-behave-action \
            --arg commit "$GITHUB_SHA" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: "statistics", client_payload: {project: $project, commit: $commit, timestamp: $timestamp, metrics: .}}' \
            metrics/*.json >payload.json
          gh api --method POST repos/christianpflugradt/badges-and-stuff/dispatches --input payload.json
