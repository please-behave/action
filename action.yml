name: Please Behave
description: Prepare Please Behave and run governance with GitHub review context and summaries
inputs:
  version:
    description: Exact stable Please Behave release tag, required when install is true
    required: false
  install:
    description: Download the versioned CLI (true) or use please already on PATH (false)
    required: false
    default: 'true'
  sync:
    description: Synchronize declared governance before execution (true or false)
    required: false
    default: 'false'
  execution-point:
    description: Execution point to run in the consuming repository
    required: false
    default: check
  checks-only:
    description: Run deterministic checks without reviews (true or false)
    required: false
    default: 'false'
  run:
    description: Execute Please Behave after installation (true or false)
    required: false
    default: 'true'
  summary:
    description: Append a per-invocation GitHub Job Summary (true or false)
    required: false
    default: 'true'
  gateway-url:
    description: Gateway origin supplied as a GitHub Actions secret for attestation delivery
    required: false
  publish-required:
    description: Fail an otherwise successful step when attestation delivery fails (true or false)
    required: false
    default: 'false'
  register:
    description: >-
      Register committed rule versions and Rule Sets after a successful run (true or false).
      Rule Set registration requires CLI v0.23.0 or later and a version for each set.
    required: false
    default: 'false'
  release-version:
    description: >-
      Record a release with this version after the optional run, independent of run.
      Requires gateway-url and CLI v0.24.0 or later.
    required: false
  release-commit:
    description: Full Git object ID of the released commit, defaulting to HEAD; requires release-version
    required: false
  deployment-target:
    description: >-
      Record a deployment to this registered target after the optional run, independent of run.
      Requires gateway-url, deployment-repository, one of deployment-version and deployment-commit,
      and CLI v0.25.0 or later.
    required: false
  deployment-repository:
    description: Normalized identity or network Git URL of the deployed repository; requires deployment-target
    required: false
  deployment-version:
    description: Deployed version; exactly one of deployment-version and deployment-commit is required
    required: false
  deployment-commit:
    description: Full Git object ID of the deployed commit; exactly one of deployment-version and deployment-commit is required
    required: false
runs:
  using: composite
  steps:
    - name: Prepare Please Behave
      shell: bash
      env:
        PLEASE_VERSION: ${{ inputs.version }}
        PLEASE_INSTALL: ${{ inputs.install }}
        PLEASE_SYNC: ${{ inputs.sync }}
        PLEASE_RUN: ${{ inputs.run }}
        PLEASE_SUMMARY: ${{ inputs.summary }}
        PLEASE_CHECKS_ONLY: ${{ inputs.checks-only }}
        PLEASE_PUBLISH_REQUIRED: ${{ inputs.publish-required }}
        PLEASE_REGISTER: ${{ inputs.register }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: bash "$ACTION_DIRECTORY/scripts/install.sh"
    - name: Synchronize governance
      if: inputs.sync == 'true'
      shell: bash
      run: please sync --yes
    - name: Run Please Behave
      if: inputs.run == 'true'
      shell: bash
      env:
        PLEASE_EXECUTION_POINT_INPUT: ${{ inputs.execution-point }}
        PLEASE_SUMMARY: ${{ inputs.summary }}
        PLEASE_CHECKS_ONLY: ${{ inputs.checks-only }}
        PLEASE_GATEWAY_URL_INPUT: ${{ inputs.gateway-url }}
        PLEASE_PUBLISH_REQUIRED: ${{ inputs.publish-required }}
        PLEASE_REGISTER: ${{ inputs.register }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: bash "$ACTION_DIRECTORY/scripts/run.sh"
    - name: Record release
      if: inputs.release-version != '' || inputs.release-commit != ''
      shell: bash
      env:
        PLEASE_RELEASE_VERSION: ${{ inputs.release-version }}
        PLEASE_RELEASE_COMMIT: ${{ inputs.release-commit }}
        PLEASE_GATEWAY_URL_INPUT: ${{ inputs.gateway-url }}
        PLEASE_PUBLISH_REQUIRED: ${{ inputs.publish-required }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: python3 "$ACTION_DIRECTORY/scripts/record-release.py"
    - name: Record deployment
      if: inputs.deployment-target != '' || inputs.deployment-repository != '' || inputs.deployment-version != '' || inputs.deployment-commit != ''
      shell: bash
      env:
        PLEASE_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
        PLEASE_DEPLOYMENT_REPOSITORY: ${{ inputs.deployment-repository }}
        PLEASE_DEPLOYMENT_VERSION: ${{ inputs.deployment-version }}
        PLEASE_DEPLOYMENT_COMMIT: ${{ inputs.deployment-commit }}
        PLEASE_GATEWAY_URL_INPUT: ${{ inputs.gateway-url }}
        PLEASE_PUBLISH_REQUIRED: ${{ inputs.publish-required }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: python3 "$ACTION_DIRECTORY/scripts/record-deployment.py"
