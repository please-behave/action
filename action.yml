name: Please Behave
description: Prepare Please Behave and run governance with GitHub review context and summaries
inputs:
  version:
    description: Exact stable Please Behave release tag, required when install is true
    required: false
  install:
    description: Download the versioned CLI (true) or use please already on PATH (false)
    required: false
    default: 'true'
  sync:
    description: Synchronize declared governance before execution (true or false)
    required: false
    default: 'false'
  execution-point:
    description: Execution point to run in the consuming repository
    required: false
    default: check
  checks-only:
    description: Run deterministic checks without reviews (true or false)
    required: false
    default: 'false'
  run:
    description: Execute Please Behave after installation (true or false)
    required: false
    default: 'true'
  summary:
    description: Append a per-invocation GitHub Job Summary (true or false)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Prepare Please Behave
      shell: bash
      env:
        PLEASE_VERSION: ${{ inputs.version }}
        PLEASE_INSTALL: ${{ inputs.install }}
        PLEASE_SYNC: ${{ inputs.sync }}
        PLEASE_RUN: ${{ inputs.run }}
        PLEASE_SUMMARY: ${{ inputs.summary }}
        PLEASE_CHECKS_ONLY: ${{ inputs.checks-only }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: bash "$ACTION_DIRECTORY/scripts/install.sh"
    - name: Synchronize governance
      if: inputs.sync == 'true'
      shell: bash
      run: please sync --yes
    - name: Run Please Behave
      if: inputs.run == 'true'
      shell: bash
      env:
        PLEASE_EXECUTION_POINT_INPUT: ${{ inputs.execution-point }}
        PLEASE_SUMMARY: ${{ inputs.summary }}
        PLEASE_CHECKS_ONLY: ${{ inputs.checks-only }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: bash "$ACTION_DIRECTORY/scripts/run.sh"
